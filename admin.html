<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — 아오모리·아키타 로드트립</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="style.css">
<script src="maps-helper.js"></script>
<style>
  /* ===== 로그인 화면 ===== */
  #loginScreen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px;
  }
  #loginScreen h2{ font-size:18px; margin:0 0 4px; }
  #loginScreen p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; text-align:center; }
  #loginScreen input{
    font-family:'IBM Plex Mono',monospace; font-size:16px; text-align:center; letter-spacing:4px;
    border:1.5px solid var(--line); border-radius:10px; padding:12px 16px; width:200px; background:#fff;
  }
  #loginScreen button{
    background:var(--vermillion); color:#fff; border:none; border-radius:10px; padding:12px 24px;
    font-weight:700; font-size:14px; cursor:pointer; width:200px;
  }
  #loginError{ color:var(--vermillion); font-size:12px; height:16px; }
  #adminApp{ display:none; }

  /* ===== 툴바 ===== */
  .toolbar{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .toolbtn{
    font-family:'Pretendard',sans-serif; font-size:11.5px; font-weight:600; border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; background:var(--card-bg); color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .toolbtn.primary{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
  .toolbtn.danger{ color:var(--vermillion); }
  .filelabel{ display:inline-block; }
  .filelabel input[type=file]{ display:none; }
  .savedtoast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--paper); font-size:11.5px; font-family:'IBM Plex Mono',monospace;
    padding:8px 16px; border-radius:999px; box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition:transform 0.25s ease; z-index:100;
  }
  .savedtoast.show{ transform:translateX(-50%) translateY(0); }

  /* ===== 편집 필드 ===== */
  .field input, .field textarea{
    font-family:'Pretendard',sans-serif; font-size:14px; color:var(--ink);
    border:none; border-bottom:1.5px dashed var(--indigo); background:transparent;
    padding:5px 2px; resize:none; outline:none; width:100%;
  }
  .field input:focus, .field textarea:focus{ border-bottom-style:solid; }
  .field textarea{ min-height:34px; line-height:1.4; }
  .field.mono input{ font-family:'IBM Plex Mono',monospace; }
  .title-input{
    font-family:'Pretendard',sans-serif; font-weight:700; font-size:17px; color:var(--ink);
    border:none; border-bottom:1.5px dashed var(--indigo); background:transparent; width:100%; padding:3px 0;
    margin-bottom:2px;
  }
  .place-input{
    font-size:12.5px; color:var(--ink-soft); border:none; border-bottom:1px dashed var(--line);
    background:transparent; width:100%; padding:2px 0; margin-bottom:4px;
  }
  .time-input{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--indigo); font-weight:600;
    border:none; border-bottom:1px dashed var(--indigo); background:transparent; width:74px; padding:0;
  }
  .transit-mapsq{ padding:0 4px 6px 0; }
  .transit-mapsq input{
    font-family:'Pretendard',sans-serif; font-size:11px; color:var(--ink-soft); width:100%;
    border:none; border-bottom:1px dashed var(--line); background:transparent; padding:2px 0; outline:none;
  }
  .transit-mapsq input:focus{ border-bottom-color:var(--indigo); color:var(--ink); }
  .status-select{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; margin-left:auto;
    border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#fff;
  }

  .newcard-btn{ margin:0 16px 20px; }

  .ledger-editor{ padding:0 16px 40px; }
  .ledger-card{ background:var(--card-bg); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px 14px; }
  .ledger-total{ display:flex; justify-content:space-between; align-items:baseline; padding-bottom:12px; margin-bottom:12px; border-bottom:1.5px dashed var(--line); }
  .ledger-total .lbl{ font-weight:700; font-size:15px; }
  .ledger-total .amt{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px; color:var(--vermillion); }
  .ledger-add{ display:flex; gap:6px; margin-bottom:12px; }
  .ledger-add input{ font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 9px; outline:none; background:#fff; }
  .ledger-add input.li-name{ flex:1.4; min-width:0; }
  .ledger-add input.li-amt{ flex:1; min-width:0; font-family:'IBM Plex Mono',monospace; }
  .ledger-add button{ flex:0 0 auto; background:var(--vermillion); color:#fff; border:none; border-radius:8px; padding:0 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .ledger-item{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .ledger-item:last-child{ border-bottom:none; }
  .ledger-item .li-name{ flex:1; }
  .ledger-item .li-amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .ledger-item .li-del{ background:none; border:none; color:#b8ac8f; font-size:16px; cursor:pointer; }
  .ledger-empty{ text-align:center; color:#a89f89; font-size:12px; padding:14px 0; }

  /* ===== 맛집 편집기 ===== */
  .rest-group{ margin:18px 0; }
  .rest-group-title{ font-weight:700; font-size:12.5px; color:var(--indigo); margin-bottom:8px; }
  .rest-card{
    background:var(--card-bg); border:1px solid var(--line); border-radius:11px;
    padding:10px 12px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px;
  }
  .rest-card.confirmed{ background:var(--teal-soft); border-color:var(--teal); }
  .rest-edit-row{ display:flex; gap:6px; align-items:center; }
  .rest-edit-row input{ flex:1; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff; }
  .rest-edit-menu{ width:100%; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff; }
  .rest-confirm{ display:flex; align-items:center; gap:4px; font-size:11px; white-space:nowrap; color:var(--teal); font-weight:600; }
  .rest-edit-row .li-del{ flex:0 0 auto; background:none; border:1px solid var(--vermillion); color:var(--vermillion); border-radius:6px; padding:6px 10px; font-size:11px; cursor:pointer; }

  .budgetfield{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--paper); }
  .budgetfield input{ width:110px; font-family:'IBM Plex Mono',monospace; font-size:12px; border:none; border-radius:6px; padding:4px 6px; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>🔒 관리자 모드</h2>
  <p>비밀번호를 입력하면 일정 내용을 수정할 수 있어요.<br>(뷰 페이지는 누구나 볼 수 있어요)</p>
  <input type="password" id="pwInput" inputmode="numeric" placeholder="••••" maxlength="10">
  <div id="loginError"></div>
  <button id="loginBtn">입장</button>
</div>

<div id="adminApp">
<header>
  <div class="brand">
    <h1>🔧 관리자 <span style="font-weight:500; font-size:13px;">아오모리·아키타 로드트립</span></h1>
  </div>
  <div class="daynav" id="daynav"></div>
  <div class="toolbar">
    <label class="filelabel toolbtn">📂 data.json 불러오기<input type="file" accept="application/json" id="loadFileInput"></label>
    <button class="toolbtn" id="refetchBtn">🔄 서버에서 다시 불러오기</button>
    <button class="toolbtn primary" id="exportBtn">💾 data.json 다운로드</button>
  </div>
  <div class="summarybar" style="margin-top:10px;">
    <div><span class="lbl">실제 사용(2인, 엔화)</span><br><span class="val mono" id="actualTotal">¥0</span></div>
    <div class="divider">/</div>
    <div class="budgetfield">예산(원)<input type="number" id="budgetInput" value="3272055"></div>
  </div>
</header>

<main id="main"></main>

</div>

<div class="savedtoast" id="savedtoast">✓ 반영됨 (다운로드 후 깃허브 업로드 필요)</div>

<script>
const CAT_ICON = {식사:"🍴", 숙소:"🏨", 관광:"🎫", 렌트카:"🚗", 기타:"🧾"};
const JPY_TO_KRW = 8.9;
let DATA = null;

function mapsUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q || ""); }
function won(n){ return "₩" + Math.round(n).toLocaleString("ko-KR"); }
function yen(n){ return "¥" + Math.round(n).toLocaleString("ko-KR"); }

/* ============================================================
   🔒 로그인
   ============================================================ */
const ADMIN_PASSWORD = "0918";
function attemptLogin(){
  const pw = document.getElementById("pwInput").value;
  if(pw === ADMIN_PASSWORD){
    sessionStorage.setItem("adminUnlocked","1");
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminApp").style.display = "block";
    boot();
  } else {
    document.getElementById("loginError").textContent = "비밀번호가 틀렸어요";
  }
}
document.getElementById("loginBtn").addEventListener("click", attemptLogin);
document.getElementById("pwInput").addEventListener("keydown", e => { if(e.key==="Enter") attemptLogin(); });
if(sessionStorage.getItem("adminUnlocked") === "1"){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("adminApp").style.display = "block";
  window.addEventListener("DOMContentLoaded", boot);
}

/* ============================================================
   토스트
   ============================================================ */
let toastTimer=null;
function flashSaved(msg){
  const t = document.getElementById("savedtoast");
  if(msg) t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 1800);
}

/* ============================================================
   데이터 로드 (서버 fetch → 실패 시 파일선택 폴백)
   ============================================================ */
async function fetchFromServer(){
  const res = await fetch("./data.json", {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  return await res.json();
}

document.getElementById("loadFileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      DATA = JSON.parse(ev.target.result);
      renderAll();
      flashSaved("✓ 파일에서 불러옴");
    }catch(err){ alert("JSON 파일을 읽지 못했어요: " + err.message); }
  };
  reader.readAsText(file);
});

document.getElementById("refetchBtn").addEventListener("click", async () => {
  try{ DATA = await fetchFromServer(); renderAll(); flashSaved("✓ 서버에서 새로 불러옴"); }
  catch(e){ alert("서버에서 불러오지 못했어요. 아래 '📂 data.json 불러오기'로 최근 다운로드한 파일을 선택해주세요."); }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  DATA.updatedAt = new Date().toISOString();
  DATA.budgetTotal = Number(document.getElementById("budgetInput").value) || 0;
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.json";
  a.click();
  flashSaved("✓ 다운로드됨 — 깃허브에 업로드해서 덮어써주세요");
});

async function boot(){
  try{
    DATA = await fetchFromServer();
  }catch(e){
    console.warn("서버에서 못 불러옴 — 파일 선택으로 불러와주세요", e);
    document.getElementById("main").innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.8;">
      서버에서 data.json을 자동으로 불러오지 못했어요.<br>
      (파일을 직접 더블클릭해서 열었을 경우 흔히 발생해요)<br><br>
      위 <b>📂 data.json 불러오기</b> 버튼으로 최근 다운로드해둔 data.json을 선택해주세요.<br>
      처음 시작이라면 깃허브에 올린 data.json을 다운로드해서 선택하시면 돼요.
    </div>`;
    return;
  }
  document.getElementById("budgetInput").value = DATA.budgetTotal || 0;
  renderAll();
}

/* ============================================================
   렌더링
   ============================================================ */
function buildCard(item, dayIdx, itemIdx){
  if(item.type === "transit"){
    const path = `${dayIdx}.${itemIdx}`;
    return `<div class="card transit" data-path="${path}">
      <div class="transit-row">
        <span class="t-time">${item.time}</span><span>${item.title}</span><span class="t-note">${item.note||""}</span>
      </div>
      <div class="transit-mapsq">
        <input type="text" value="${item.mapsQ||""}" placeholder="지도에 표시할 위치(선택)" data-path="${path}" data-field="mapsQ" oninput="onField(this)" onblur="refreshMapForField(this)">
      </div>
    </div>`;
  }
  const path = `${dayIdx}.${itemIdx}`;
  const menuField = item.cat === "식사" ? `
    <div class="field"><label>추천메뉴 / 특징</label>
      <textarea data-path="${path}" data-field="menu" oninput="onField(this)">${item.menu||""}</textarea>
    </div>` : "";

  return `
  <div class="card" data-path="${path}">
    <div class="card-top">
      <div class="row1">
        <span class="cat ${item.cat}">${CAT_ICON[item.cat]||""} ${item.cat}</span>
        <input type="text" class="time-input" value="${item.time||""}" data-path="${path}" data-field="time" oninput="onField(this)">
        <select class="status-select" data-path="${path}" data-field="status" onchange="onField(this)">
          <option value="confirmed" ${item.status==="confirmed"?"selected":""}>확정</option>
          <option value="pending" ${item.status==="pending"?"selected":""}>미정</option>
          <option value="" ${!item.status?"selected":""}>—</option>
        </select>
      </div>
      <input type="text" class="title-input" value="${item.title||""}" data-path="${path}" data-field="title" oninput="onField(this)">
      <input type="text" class="place-input" value="${item.place||""}" placeholder="장소/위치" data-path="${path}" data-field="place" oninput="onField(this)">
    </div>

    <div class="field-grid">
      <div class="field mono">
        <label>예산</label>
        <input type="text" value="${item.price||""}" placeholder="예: 3,000엔 (2인)" data-path="${path}" data-field="price" oninput="onField(this)">
      </div>
      <div class="field mono">
        <label>실제 사용액 (2인, 엔화)</label>
        <input type="number" inputmode="numeric" value="${item.actual||""}" placeholder="예: 1500" data-path="${path}" data-field="actual" oninput="onField(this); computeSummary();">
      </div>
      ${menuField}
      <div class="field mono">
        <label>전화번호</label>
        <input type="text" value="${item.phone||""}" placeholder="010-0000-0000" data-path="${path}" data-field="phone" oninput="onField(this)">
      </div>
      <div class="field">
        <label>구글맵 검색어 / 주소</label>
        <input type="text" value="${item.mapsQ||""}" placeholder="장소명 또는 주소" data-path="${path}" data-field="mapsQ" oninput="onField(this)" onblur="refreshMapForField(this)">
      </div>
      <hr class="perf">
      <div class="field">
        <label>메모</label>
        <textarea data-path="${path}" data-field="note" oninput="onField(this)">${item.note||""}</textarea>
      </div>
    </div>
  </div>`;
}

function onField(el){
  const [di, ii] = el.dataset.path.split(".").map(Number);
  DATA.days[di].items[ii][el.dataset.field] = el.value;
}

function refreshMapForField(el){
  if(el.dataset.field !== "mapsQ" || !window.__currentTabId) return;
  const [di] = el.dataset.path.split(".").map(Number);
  const containerId = "map-" + window.__currentTabId;
  delete _dayMapRendered[containerId];
  renderDayMap(containerId, DATA.days[di].items);
}

function computeSummary(){
  let sum = 0;
  DATA.days.forEach(day => day.items.forEach(item => {
    const v = parseFloat(item.actual);
    if(!isNaN(v)) sum += v;
  }));
  (DATA.ledger||[]).forEach(e => { const v = Number(e.amount); if(!isNaN(v)) sum += v; });
  document.getElementById("actualTotal").textContent = yen(sum);
}

function renderLedgerEditor(){
  const total = (DATA.ledger||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const items = (DATA.ledger||[]).length
    ? DATA.ledger.map((e,idx) => `<div class="ledger-item"><span class="li-name">${e.name}</span><span class="li-amt">${yen(e.amount)}</span><button class="li-del" onclick="delLedger(${idx})">✕</button></div>`).join("")
    : `<div class="ledger-empty">항목이 없어요.</div>`;
  return `
    <div class="daymarker">
      <div class="stamp" style="border-color:var(--vermillion); color:var(--vermillion);"><span class="num" style="font-size:20px;">💰</span></div>
      <div class="theme">간이 가계부<small>계획에 없던 지출 관리</small></div>
    </div>
    <div class="ledger-editor">
      <div class="ledger-card">
        <div class="ledger-total"><span class="lbl">합계 (엔화)</span><span class="amt mono">${yen(total)}</span></div>
        <div class="ledger-add">
          <input type="text" class="li-name" id="ledgerNameInput" placeholder="항목명">
          <input type="number" inputmode="numeric" class="li-amt" id="ledgerAmtInput" placeholder="금액(¥)">
          <button onclick="addLedger()">추가</button>
        </div>
        <div id="ledgerList">${items}</div>
      </div>
    </div>`;
}

function addLedger(){
  const nameInput = document.getElementById("ledgerNameInput");
  const amtInput = document.getElementById("ledgerAmtInput");
  const name = nameInput.value.trim();
  const amount = parseFloat(amtInput.value);
  if(!name || isNaN(amount)) return;
  if(!DATA.ledger) DATA.ledger = [];
  DATA.ledger.push({name, amount});
  nameInput.value=""; amtInput.value="";
  renderAll();
  flashSaved();
}
function delLedger(idx){
  DATA.ledger.splice(idx,1);
  renderAll();
  flashSaved();
}

function renderRestaurantEditor(){
  const list = DATA.restaurants || [];
  const groups = [];
  list.forEach((r, idx) => {
    let g = groups.find(x => x.name === r.group);
    if(!g){ g = { name: r.group, items: [] }; groups.push(g); }
    g.items.push({ ...r, idx });
  });
  const groupsHtml = groups.map(g => `
    <div class="rest-group">
      <div class="rest-group-title">${g.name}</div>
      ${g.items.map(r => `
        <div class="rest-card${r.confirmed ? ' confirmed' : ''}" data-ridx="${r.idx}">
          <div class="rest-edit-row">
            <input type="text" value="${r.name}" placeholder="이름" data-rfield="name" onchange="onRestField(${r.idx}, this)">
            <label class="rest-confirm"><input type="checkbox" ${r.confirmed?'checked':''} onchange="onRestField(${r.idx}, this, true)"> 확정</label>
          </div>
          <input type="text" value="${r.menu||''}" placeholder="대표메뉴" class="rest-edit-menu" data-rfield="menu" onchange="onRestField(${r.idx}, this)">
          <div class="rest-edit-row">
            <input type="text" value="${r.budget||''}" placeholder="예산(1인)" data-rfield="budget" onchange="onRestField(${r.idx}, this)">
            <input type="text" value="${r.mapsQ||''}" placeholder="지도 검색어" data-rfield="mapsQ" onchange="onRestField(${r.idx}, this)">
          </div>
          <div class="rest-edit-row">
            <input type="text" value="${r.group}" placeholder="분류(예: 8/21 아오모리 점심)" data-rfield="group" onchange="onRestField(${r.idx}, this)">
            <button class="li-del" onclick="delRestaurant(${r.idx})">✕ 삭제</button>
          </div>
        </div>
      `).join("")}
    </div>
  `).join("");
  return `
    <div class="daymarker">
      <div class="stamp" style="border-color:var(--indigo); color:var(--indigo);"><span class="num" style="font-size:20px;">🍴</span></div>
      <div class="theme">맛집 후보<small>날짜·끼니별 후보 관리</small></div>
    </div>
    <div class="ledger-editor">
      <div class="ledger-card">
        <div class="ledger-add" style="flex-direction:column; align-items:stretch;">
          <input type="text" id="restGroupInput" placeholder="분류(예: 8/21 아오모리 점심)" style="margin-bottom:6px;">
          <input type="text" id="restNameInput" placeholder="이름" style="margin-bottom:6px;">
          <input type="text" id="restMenuInput" placeholder="대표메뉴" style="margin-bottom:6px;">
          <div style="display:flex; gap:6px;">
            <input type="text" id="restBudgetInput" placeholder="예산(1인)" style="flex:1;">
            <input type="text" id="restMapsQInput" placeholder="지도 검색어" style="flex:1;">
          </div>
          <button onclick="addRestaurant()" style="margin-top:8px;">추가</button>
        </div>
      </div>
      ${groupsHtml || '<div class="ledger-empty">등록된 맛집이 없어요.</div>'}
    </div>`;
}

function onRestField(idx, el, isCheckbox){
  if(isCheckbox){ DATA.restaurants[idx].confirmed = el.checked; }
  else { DATA.restaurants[idx][el.dataset.rfield] = el.value; }
  renderAll();
  flashSaved();
}

function addRestaurant(){
  const group = document.getElementById("restGroupInput").value.trim();
  const name = document.getElementById("restNameInput").value.trim();
  const menu = document.getElementById("restMenuInput").value.trim();
  const budget = document.getElementById("restBudgetInput").value.trim();
  const mapsQ = document.getElementById("restMapsQInput").value.trim();
  if(!group || !name) return;
  if(!DATA.restaurants) DATA.restaurants = [];
  DATA.restaurants.push({ group, name, menu, budget, mapsQ, confirmed:false });
  renderAll();
  flashSaved();
}

function delRestaurant(idx){
  DATA.restaurants.splice(idx,1);
  renderAll();
  flashSaved();
}

function renderAll(){
  const main = document.getElementById("main");
  const nav = document.getElementById("daynav");
  main.innerHTML = "";
  nav.innerHTML = "";

  const tabIds = [];

  DATA.days.forEach((day, di) => {
    const tabId = "tab-day-"+di;
    tabIds.push(tabId);
    const chip = document.createElement("div");
    chip.className = "daychip" + (di===0 ? " active" : "");
    chip.textContent = day.d + " " + day.w;
    chip.onclick = () => showTab(tabId);
    nav.appendChild(chip);

    const section = document.createElement("section");
    section.id = tabId;
    section.className = "tabpanel" + (di===0 ? "" : " hidden");
    section.innerHTML = `
      <div class="daymarker">
        <div class="stamp"><span class="num">${day.d}</span><span class="dow">${day.w}요일</span></div>
        <div class="theme">${day.theme}<small>${day.sub}</small></div>
      </div>
      <div class="map-wrap" id="map-${tabId}"><div class="map-placeholder">지도 준비 중...</div></div>
      <div class="cards">${day.items.map((it,ii)=>buildCard(it,di,ii)).join("")}</div>
    `;
    main.appendChild(section);
  });

  const ledgerTabId = "tab-ledger";
  tabIds.push(ledgerTabId);
  const ledgerChip = document.createElement("div");
  ledgerChip.className = "daychip";
  ledgerChip.style.borderColor = "var(--vermillion)";
  ledgerChip.style.color = "var(--vermillion)";
  ledgerChip.textContent = "💰 가계부";
  ledgerChip.onclick = () => showTab(ledgerTabId);
  nav.appendChild(ledgerChip);

  const holder = document.createElement("div");
  holder.id = ledgerTabId;
  holder.className = "tabpanel hidden";
  holder.innerHTML = renderLedgerEditor();
  main.appendChild(holder);

  const restTabId = "tab-restaurants";
  tabIds.push(restTabId);
  const restChip = document.createElement("div");
  restChip.className = "daychip";
  restChip.style.borderColor = "var(--indigo)";
  restChip.style.color = "var(--indigo)";
  restChip.textContent = "🍴 맛집";
  restChip.onclick = () => showTab(restTabId);
  nav.appendChild(restChip);

  const restHolder = document.createElement("div");
  restHolder.id = restTabId;
  restHolder.className = "tabpanel hidden";
  restHolder.innerHTML = renderRestaurantEditor();
  main.appendChild(restHolder);

  function showTab(tabId){
    tabIds.forEach(id => document.getElementById(id).classList.toggle("hidden", id !== tabId));
    Array.from(nav.children).forEach((chip, idx) => chip.classList.toggle("active", tabIds[idx] === tabId));
    window.scrollTo({top:0, behavior:"instant"});
    window.__currentTabId = tabId;
    window.__currentTabIds = tabIds;
    const dayIdx = tabIds.indexOf(tabId);
    if(dayIdx >= 0 && dayIdx < DATA.days.length){
      renderDayMap("map-"+tabId, DATA.days[dayIdx].items);
    }
  }
  window.__showTab = showTab;

  computeSummary();
  if(DATA.days.length) showTab(tabIds[0]);
}
</script>
</body>
</html>
